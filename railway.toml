# Railway service config for the MenoCare Flask backend.
#
# This file lives at the REPO ROOT rather than in backend/ on purpose:
# backend/app.py opens `BASE_DIR.parent / "models" / "model.pkl"` at import time
# and does not guard the open(), so a build context that excludes the sibling
# models/ directory crashes the service on boot. Leave the Railway service's
# "Root Directory" setting empty (= repo root); pointing it at backend/ breaks
# model loading.
#
# There is deliberately no [build] buildCommand here. Nixpacks installs
# dependencies in its own "install" phase, which it generates from the
# requirements.txt at the build root (see the shim in ./requirements.txt).
# A custom buildCommand runs in a later phase where pip is not on PATH, which
# fails with "pip: command not found".

[build]
builder = "NIXPACKS"
# Don't rebuild the API when only the Next.js frontend changes.
watchPatterns = ["backend/**", "models/**", "requirements.txt", "railway.toml"]

[deploy]
# --chdir makes gunicorn import backend/app.py while keeping the repo root as the
# working tree, so BASE_DIR.parent still resolves to models/.
#
# --workers 1 is required, not a tuning choice: email_service.start_scheduler()
# runs at import and is not idempotent, so every extra worker adds another poller
# and each reminder email would be sent once per worker.
#
# --timeout 120 covers /api/forecast, which runs a RandomForest and is slow.
startCommand = "gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"

healthcheckPath = "/api/health"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
